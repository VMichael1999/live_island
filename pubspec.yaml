name: live_island_kit
description: "iOS Live Activities and Android Live Updates with a single Dart API, no Swift or Kotlin. Dynamic Island, lock screen, presets, charts and a live preview."
version: 0.2.0
repository: https://github.com/VMichael1999/live_island_kit
issue_tracker: https://github.com/VMichael1999/live_island_kit/issues
topics:
  - live-activities
  - dynamic-island
  - notifications
  - ios
  - android

screenshots:
  - description: "Match score: compact and expanded island and lock screen"
    path: doc/assets/galeria/marcador.png
  - description: "Ride pickup with a dotted bar and markers"
    path: doc/assets/galeria/recogida_clara.png
  - description: "Stock quote with a line chart"
    path: doc/assets/galeria/bolsa.png
  - description: "Store pickup order in three steps"
    path: doc/assets/galeria/tienda.png
  - description: "Medical waiting room"
    path: doc/assets/galeria/sala_medica.png
  - description: "Electric car charging with a glowing cable"
    path: doc/assets/galeria/carga.png
  - description: "Flight with a curved route"
    path: doc/assets/galeria/vuelo.png
  - description: "Trip start with the driver's PIN code"
    path: doc/assets/galeria/pin.png
  - description: "Delivery order in four stages with icons"
    path: doc/assets/galeria/pedido.png

executables:
  setup:

environment:
  sdk: ^3.7.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  path_drawing: ^1.0.1
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_schema: ^5.2.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Íconos de Android (LiveIcon.android) y la imagen del Taxi que traen los presets.
  assets:
    - assets/icons/
    - assets/presets/

  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.vmichael1999.live_island
        pluginClass: LiveIslandPlugin
      ios:
        pluginClass: LiveIslandPlugin

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
