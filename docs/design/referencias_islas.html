<title>Galería de referencias de isla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: banco de referencias. Cada diseño es una ficha con su maqueta fija
   (los colores de la maqueta no cambian con el tema) y un panel que la edita. */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --ink:#12161C; --muted:#5A6573; --line:#D6DCE4;
  --accent:#2F6BFF; --accent-ink:#FFFFFF; --stage:#DDE3EC;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --card:#161A21; --ink:#EDF0F4; --muted:#9AA5B4; --line:#2A313B;
  --accent:#6C95FF; --accent-ink:#0B1020; --stage:#1F2530; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --card:#161A21; --ink:#EDF0F4; --muted:#9AA5B4; --line:#2A313B;
  --accent:#6C95FF; --accent-ink:#0B1020; --stage:#1F2530; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;padding-inline:16px;padding-block:28px 56px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
h1{font:800 clamp(28px,4.2vw,44px)/1.02 var(--display);letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:62ch}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 14px var(--body);cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile h2{font:600 15px var(--body);margin:0}
.tile .meta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tile small{color:var(--muted)}
.stage{border-radius:14px;padding:22px 16px;display:grid;place-items:center;overflow:hidden;min-height:150px}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);padding-top:12px}
.fields label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fields input[type=text],.fields select{font:500 14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.fields input[type=range]{width:100%;accent-color:var(--accent)}
.fields input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
.fields .chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13px}
.fields .row{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}

/* ---- maquetas (colores propios, no siguen el tema) ---- */
.m{font-family:var(--sys);width:100%;max-width:400px;position:relative}
.m *{box-sizing:border-box}
.m .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.m .ttl{font-weight:700;letter-spacing:-.01em}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none}
.dash{background:repeating-linear-gradient(90deg,var(--d,#aaa) 0 14px,transparent 14px 24px);height:4px;border-radius:2px}
.ring{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%}
.trk{position:relative;height:26px}
.pill{border-radius:999px}
svg text{font-family:var(--sys)}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Galería de referencias de isla</h1>
      <p>Diseños de Live Activities que queremos poder construir con el paquete. Toca una ficha para editar sus textos, colores, avance y partes: es lo que tendría que expresar el contrato del paquete.</p>
    </div>
    <div class="bar">
      <button id="reset">Restablecer todo</button>
      <button id="theme">Tema de la página</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
</div>

const spark = (pts, color, w=330, h=80, base=true) => {
  const max = Math.max(...pts), min = Math.min(...pts);
  const xy = pts.map((p,i) => [i/(pts.length-1)*w, h-6-((p-min)/(max-min||1))*(h-14)]);
  const d = xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${base?`<line x1="0" x2="${w}" y1="${h*.55}" y2="${h*.55}" stroke="#ffffff55" stroke-dasharray="3 4"/>`:''}<path d="${d} L${w} ${h} L0 ${h}Z" fill="${color}22"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
};
const series = (seed, n=34, trend=0) => { let x=seed, out=[], v=50; for(let i=0;i<n;i++){ x=(x*9301+49297)%233280; v+= (x/233280-.5)*14 + trend; out.push(v);} return out; };

const bezSplit = (p0,p1,p2,t) => { const a=[p0[0]+(p1[0]-p0[0])*t,p0[1]+(p1[1]-p0[1])*t], b=[p1[0]+(p2[0]-p1[0])*t,p1[1]+(p2[1]-p1[1])*t], m=bez(p0,p1,p2,t); return {a,m,b}; };

{ id:'flighty', title:'Vuelo · en hora (SFO → JFK)', stage:'linear-gradient(135deg,#e9ebf0,#c3c8d2)',
  fields:[T('fl','Vuelo','FL234'),T('app','App','FLIGHTY'),T('o','Origen','SFO'),T('d','Destino','JFK'),T('st','Estado','On Time'),T('sub','Detalle','Landing in 55m'),T('bag','Maletas','4'),R('p','Avance',80,5,95),C('acc','Verde','#5df08a'),C('bagc','Color maletas','#ffb61e'),B('bagOn','Mostrar maletas',true)],
  render:s=>{
    const P0=[8,40],P1=[100,-2],P2=[192,40], sp=bezSplit(P0,P1,P2,s.p/100);
    const ang=Math.atan2(sp.b[1]-sp.m[1],sp.b[0]-sp.m[0])*180/Math.PI;
    return `<div class="m" style="background:#000;border-radius:34px;padding:14px 20px 16px;color:#fff;max-width:420px">
    <div class="row"><span style="font:500 19px var(--sys);letter-spacing:.02em">${esc(s.fl)}</span><span class="row" style="gap:8px"><span class="av" style="width:27px;height:27px;border-radius:7px;background:#2a2a2e">${plane('#fff',17,0)}</span><span style="font:500 19px var(--sys);letter-spacing:.04em">${esc(s.app)}</span></span></div>

        <svg viewBox="0 0 200 52" width="100%" height="52" preserveAspectRatio="none" style="position:absolute;inset:0" aria-hidden="true"><path d="M${P0} Q${sp.a} ${sp.m}" fill="none" stroke="${s.acc}" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="M${sp.m} Q${sp.b} ${P2}" fill="none" stroke="${s.acc}" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
        <span class="av" style="position:absolute;left:0;top:23px;width:25px;height:25px;background:${s.acc};color:#04150a;font-size:15px">↗</span>
        <span class="av" style="position:absolute;right:0;top:23px;width:25px;height:25px;background:${s.acc};color:#04150a;font-size:15px">↘</span>
        <span style="position:absolute;left:${(sp.m[0]/200*100).toFixed(1)}%;top:${(sp.m[1]/52*100).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${ang.toFixed(0)}deg)">${plane('#fff',24,90)}</span></span>
      <b style="font:700 50px/1 var(--sys);letter-spacing:-.02em">${esc(s.d)}</b></div>
    <div class="row" style="margin-top:8px;align-items:flex-end"><div><div style="font:600 25px/1.1 var(--sys);color:${s.acc}">${esc(s.st)}</div><div style="font:500 21px/1.25 var(--sys);color:${s.acc};margin-top:2px;opacity:.95">${esc(s.sub)}</div></div>
      ${s.bagOn?`<span class="row" style="gap:8px;background:${s.bagc};color:#111;border-radius:14px;padding:6px 14px"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2.5" fill="#111"/><path d="M9 8V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v2" fill="none" stroke="#111" stroke-width="2"/></svg><b style="font:700 26px var(--sys)">${esc(s.bag)}</b></span>`:''}</div></div>`}}
];
(() => {
  const ids = new Set(V2.map(v => v.id));
  for (let i = M.length - 1; i >= 0; i--) if (ids.has(M[i].id)) M.splice(i, 1);
  const order = ['uber_light','uber_dark','starbucks','nike','score','stock','flighty','flight_lock','flight_island','flight_arrived','dropoff','ev','laps','meter','heart','route','order','iss','train'];
  M.push(...V2);
  M.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
})();

/* ---- aplicación ---- */
const state = {};
const open = new Set();
const defaults = () => Object.fromEntries(M.map(m => [m.id, Object.fromEntries(m.fields.map(f => [f.k, f.v]))]));
Object.assign(state, defaults());

function fieldHtml(m, f) {
  const id = `${m.id}__${f.k}`, v = state[m.id][f.k];
  if (f.t === 'text') return `<label>${esc(f.l)}<input type="text" id="${id}" data-m="${m.id}" data-k="${f.k}" value="${esc(v)}"></label>`;
  if (f.t === 'range') return `<label>${esc(f.l)} <b style="color:var(--ink)" id="${id}_v">${v}</b><input type="range" id="${id}" data-m="${m.id}" data-k="${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${v}"></label>`;
  if (f.t === 'color') return `<label>${esc(f.l)}<input type="color" id="${id}" data-m="${m.id}" data-k="${f.k}" value="${v}"></label>`;
  if (f.t === 'bool') return `<label class="chk"><input type="checkbox" id="${id}" data-m="${m.id}" data-k="${f.k}" ${v ? 'checked' : ''}> ${esc(f.l)}</label>`;
  if (f.t === 'select') return `<label>${esc(f.l)}<select id="${id}" data-m="${m.id}" data-k="${f.k}">${f.opts.map(o => `<option value="${o[0]}" ${o[0] === v ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  return '';
}

function build() {
  const g = document.getElementById('grid');
  g.innerHTML = M.map(m => `<section class="tile ${open.has(m.id) ? 'sel' : ''}" id="tile_${m.id}">
    <div class="meta"><h2>${esc(m.title)}</h2><button data-edit="${m.id}" aria-expanded="${open.has(m.id)}">${open.has(m.id) ? 'Cerrar' : 'Editar'}</button></div>
    <div class="stage" style="background:${m.stage}"><div id="mock_${m.id}" style="width:100%;display:grid;place-items:center">${m.render(state[m.id])}</div></div>
    ${open.has(m.id) ? `<div class="fields">${m.fields.map(f => fieldHtml(m, f)).join('')}
      <div class="row"><button data-copy="${m.id}">Copiar datos (JSON)</button><button data-one="${m.id}">Restablecer</button><span class="hint" id="msg_${m.id}"></span></div></div>` : ''}
  </section>`).join('');
}

function paint(id) {
  const m = M.find(x => x.id === id);
  document.getElementById('mock_' + id).innerHTML = m.render(state[id]);
}

document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.m) return;
  const m = M.find(x => x.id === t.dataset.m), f = m.fields.find(x => x.k === t.dataset.k);
  state[m.id][f.k] = f.t === 'bool' ? t.checked : (f.t === 'range' ? Number(t.value) : t.value);
  const out = document.getElementById(`${m.id}__${f.k}_v`); if (out) out.textContent = t.value;
  paint(m.id);
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.edit) { const id = b.dataset.edit; open.has(id) ? open.delete(id) : open.add(id); build(); }
  else if (b.dataset.one) { Object.assign(state[b.dataset.one], defaults()[b.dataset.one]); build(); }
  else if (b.dataset.copy) {
    const txt = JSON.stringify(state[b.dataset.copy], null, 2), msg = document.getElementById('msg_' + b.dataset.copy);
    const done = ok => { if (msg) msg.textContent = ok ? 'Copiado' : 'No se pudo copiar'; };
    try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (_) { done(false); }
  } else if (b.id === 'reset') { Object.assign(state, defaults()); build(); }
  else if (b.id === 'theme') {
    const r = document.documentElement, cur = r.getAttribute('data-theme');
    r.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  }
});
build();
</script>
